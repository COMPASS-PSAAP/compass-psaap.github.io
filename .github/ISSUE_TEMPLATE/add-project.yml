name: Add project
description: Request a new project entry
title: "Add project: "
labels: ["content", "project"]
body:
  - type: input
    id: project_name
    attributes:
      label: Project Name
    validations:
      required: true
  - type: input
    id: project_link
    attributes:
      label: Project Link
    validations:
      required: true
  - type: textarea
    id: image
    attributes:
      label: Image
      description: "Drag and drop an image file here, or paste an image URL. (Supported formats: JPG, PNG)"
  - type: textarea
    id: project_summary
    attributes:
      label: Project Summary
      description: Provide a brief overview of the project's goals and scope.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Internal notes for the review team (will not be published to the website).
  - type: checkboxes
    id: research_areas
    attributes:
      label: Research Areas
      description: "Check every area this project works in. These become tags on the Projects page and place the project on the Research Areas page."
      options:
        - label: Performance Modeling
        - label: Cross-Layer Optimization
        - label: Solver Design
        - label: System Software
        - label: Integration
        - label: Project Infrastructure
        - label: Education
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I affirm that I double-checked the information and that this project does not already exist on the site.
          required: true
